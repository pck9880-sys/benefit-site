<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;background:#e9ecf1;padding:30px}
.board{width:1200px;display:flex;flex-direction:column;gap:22px}
.row{display:grid;grid-template-columns:120px 1fr 1fr;gap:18px;align-items:stretch}
.lab{font-weight:800;font-size:28px;color:#14213d;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px}
.card{background:#fff;border-radius:16px;height:150px;display:flex;align-items:center;justify-content:center}
.card.dark{background:#14213d}
.lg{display:flex;align-items:center;gap:14px;letter-spacing:-0.04em}
/* A: 돋보기 + 체크 */
.A .w1{font-size:34px;font-weight:850;color:#14213d}.A .w2{font-size:34px;font-weight:500;color:#0f766e}
.dark .A .w1{color:#fff}.dark .A .w2{color:#5fd4c4}
.A small{display:block;font-size:11px;letter-spacing:.32em;color:#8a93a3;font-weight:600;margin-top:2px}
/* B: 방패 + 두 줄 */
.B .stack{line-height:1.05}.B .t1{font-size:15px;font-weight:600;color:#0f766e;letter-spacing:.02em}
.B .t2{font-size:36px;font-weight:850;color:#14213d}.B .t2 em{font-style:normal;color:#0f766e}
.dark .B .t2{color:#fff}.dark .B .t2 em{color:#5fd4c4}.dark .B .t1{color:#9fe0d6}
/* C: 눈 모양 렌즈 */
.C .w{font-size:35px;font-weight:800;color:#14213d}.C .w b{font-weight:850;color:#fff;background:#0f766e;padding:0 8px 2px;border-radius:8px;margin:0 2px}
.dark .C .w{color:#fff}
.C .dot{width:7px;height:7px;border-radius:50%;background:#0f766e;display:inline-block;margin-left:4px;vertical-align:top}
</style></head><body>
<div class="board">

<div class="row"><div class="lab">A</div>
 <div class="card"><div class="lg A">
  <svg width="58" height="58" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#14213d"/><circle cx="28" cy="28" r="14" fill="none" stroke="#fff" stroke-width="5"/><path d="M38.5 38.5 L49 49" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M21.5 28.5 l5 5 l9-10" fill="none" stroke="#5fd4c4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><span class="w1">정부혜택</span><span class="w2"> 한눈에</span><small>GOV BENEFIT GUIDE</small></div></div></div>
 <div class="card dark"><div class="lg A">
  <svg width="58" height="58" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0f766e"/><circle cx="28" cy="28" r="14" fill="none" stroke="#fff" stroke-width="5"/><path d="M38.5 38.5 L49 49" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M21.5 28.5 l5 5 l9-10" fill="none" stroke="#d6fff7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><span class="w1">정부혜택</span><span class="w2"> 한눈에</span><small>GOV BENEFIT GUIDE</small></div></div></div>
</div>

<div class="row"><div class="lab">B</div>
 <div class="card"><div class="lg B">
  <svg width="56" height="64" viewBox="0 0 56 64"><path d="M28 2 L52 11 V30 C52 46 41 57 28 62 C15 57 4 46 4 30 V11 Z" fill="#14213d"/><path d="M28 9 L46 16 V30 C46 42 38 51 28 55 Z" fill="#0f766e"/><path d="M17 32 l7 7 l14-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="stack"><div class="t1">놓치지 않는 지원금</div><div class="t2">정부<em>혜택</em> 한눈에</div></div></div></div>
 <div class="card dark"><div class="lg B">
  <svg width="56" height="64" viewBox="0 0 56 64"><path d="M28 2 L52 11 V30 C52 46 41 57 28 62 C15 57 4 46 4 30 V11 Z" fill="#ffffff"/><path d="M28 9 L46 16 V30 C46 42 38 51 28 55 Z" fill="#5fd4c4"/><path d="M17 32 l7 7 l14-15" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="stack"><div class="t1">놓치지 않는 지원금</div><div class="t2">정부<em>혜택</em> 한눈에</div></div></div></div>
</div>

<div class="row"><div class="lab">C</div>
 <div class="card"><div class="lg C">
  <svg width="64" height="44" viewBox="0 0 64 44"><path d="M3 22 C14 4 50 4 61 22 C50 40 14 40 3 22 Z" fill="none" stroke="#14213d" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="22" r="11" fill="#0f766e"/><path d="M26.5 22.5 l4 4 l7.5-8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="w">정부<b>혜택</b>한눈에<span class="dot"></span></div></div></div>
 <div class="card dark"><div class="lg C">
  <svg width="64" height="44" viewBox="0 0 64 44"><path d="M3 22 C14 4 50 4 61 22 C50 40 14 40 3 22 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="22" r="11" fill="#5fd4c4"/><path d="M26.5 22.5 l4 4 l7.5-8" fill="none" stroke="#14213d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="w">정부<b>혜택</b>한눈에<span class="dot"></span></div></div></div>
</div>

</div></body></html>
