name: photo-check
on:
  workflow_dispatch:
    inputs:
      query:
        description: "사진 검색어 (영어)"
        default: "baseball stadium"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p photos_out
          IFS='|' read -ra Q <<< "$QUERY"
          i=0
          for q in "${Q[@]}"; do python -m bot photos "$q" "photos_out/p$i.jpg" | tee -a photos_out/credits.txt; i=$((i+1)); done
      - uses: actions/upload-artifact@v4
        with:
          name: photos
          path: photos_out/
          retention-days: 1
