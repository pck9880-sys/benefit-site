name: auto-pipeline

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 15분마다 (텔레그램 승인 확인 + 하루 1회 글 생성)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]         # 코드 수정 시 바로 실행 (봇의 자동 커밋은 재실행 안 됨)
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      SUBMIT_NAME: ${{ secrets.SUBMIT_NAME }}
      SUBMIT_PHONE: ${{ secrets.SUBMIT_PHONE }}
      SUBMIT_EMAIL: ${{ secrets.SUBMIT_EMAIL }}
      SUBMIT_ADDRESS: ${{ secrets.SUBMIT_ADDRESS }}
      SUBMIT_BIRTH: ${{ secrets.SUBMIT_BIRTH }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'jiwon-hyetaek' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY }}
      GENERATE_HOUR_KST: ${{ vars.GENERATE_HOUR_KST }}
      AUTO_APPROVE_HOURS: ${{ vars.AUTO_APPROVE_HOURS }}
      MAX_MONTHLY_USD: ${{ vars.MAX_MONTHLY_USD }}
      BLOG_PER_DAY: ${{ vars.BLOG_PER_DAY }}
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: API 키 진단
        run: python -m bot.diag

      - name: 승인 처리 + 글 생성
        run: python -m bot tick

      - name: 변경사항 저장
        if: always()
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "auto: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 숏츠 차례면 숏츠 워크플로 시작
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m bot shorts-due; then gh workflow run shorts.yml --ref main || true; fi

      - name: 사이트 빌드
        if: always()
        run: |
          python -m bot build
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then python -m bot redirect; else cp -r _site _ghpages; fi

      - name: Cloudflare Pages 배포
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch=main || true
          command: pages deploy _site --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: 검색엔진에 새 페이지 알림 (IndexNow)
        if: success() && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          python -m bot indexnow
          git add data/indexnow_sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: indexnow" && (git push || (git pull --rebase && git push))
          fi

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _ghpages
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
