name: bgm-add
on:
  workflow_dispatch:
    inputs:
      name:
        description: "곡 이름 (예: Learn From Me - Jonathan Dimmel)"
        required: true
permissions:
  contents: write
concurrency:
  group: pipeline           # state.json 을 메인 작업과 동시에 고치지 않도록
  cancel-in-progress: false
jobs:
  add:
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot bgm-add "$NAME"
      - run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: bgm 즐겨찾기"
            git push || (git pull --rebase && git push)
          fi
