name: rewrite-posts
on:
  workflow_dispatch:
    inputs:
      ids: {description: "글 ID(쉼표) 또는 all", required: true}
      limit: {description: "all일 때 개수", default: "20"}
      branch: {description: "결과를 올릴 브랜치", default: "rewrite-draft"}
jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.branch }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m bot.rewrite "${{ inputs.ids }}" "${{ inputs.limit }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: |
          git config user.name "benefy-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/posts && git commit -m "Rewrite posts: ${{ inputs.ids }}" && git push || echo "변경 없음"
