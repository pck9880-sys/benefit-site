name: shorts

on:
  workflow_dispatch:
    inputs:
      force:
        description: "시간과 상관없이 지금 1개 만들기"
        type: boolean
        default: false
      sample:
        description: "틀 테스트: 저장된 대본·이미지 폴더 (예: assets/samples/ai_suneung)"
        type: string
        default: ""
  schedule:
    - cron: "40 3 * * *"   # 낮 12:40 KST (메인 워크플로가 못 불렀을 때 대비)

permissions:
  contents: write

concurrency:
  group: shorts             # 숏츠는 data/shorts_state.json 만 고쳐서 메인 작업과 충돌하지 않음
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_KEY }}
      HIGGSFIELD_MODEL: ${{ vars.HIGGSFIELD_MODEL }}
      HIGGSFIELD_CLIPS: ${{ vars.HIGGSFIELD_CLIPS }}
      SHORTS_CHANNEL: ${{ vars.SHORTS_CHANNEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      TYPECAST_VOICE_ID: ${{ vars.TYPECAST_VOICE_ID }}
      TYPECAST_VOICE_NAME: ${{ vars.TYPECAST_VOICE_NAME }}
      SITE_URL: ${{ vars.SITE_URL }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'jiwon-hyetaek' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      MAX_MONTHLY_USD: ${{ vars.MAX_MONTHLY_USD }}
      SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY }}
      SHORTS_HOUR_KST: ${{ vars.SHORTS_HOUR_KST }}
      SHORTS_VOICE: ${{ vars.SHORTS_VOICE }}
      SHORTS_PRIVACY: ${{ vars.SHORTS_PRIVACY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 만들 차례인지 확인
        id: due
        run: |
          if [ -n "${{ inputs.sample }}" ] || [ "${{ inputs.force }}" = "true" ] || python -m bot shorts-due; then echo "go=1" >> "$GITHUB_OUTPUT"; fi

      - name: 영상 도구 설치
        if: steps.due.outputs.go == '1'
        run: |
          pip install edge-tts playwright
          # 러너에 이미 있는 크롬을 사용 (playwright 브라우저·시스템 패키지 설치는 15분 이상 걸려서 생략)
          echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 타입캐스트 목소리 확인
        if: steps.due.outputs.go == '1'
        run: python -m bot typecast-check || true

      - name: 틀 테스트 영상
        if: inputs.sample != ''
        env:
          SAMPLE: ${{ inputs.sample }}
        run: python -m bot shorts-sample "$SAMPLE"

      - uses: actions/upload-artifact@v4
        if: inputs.sample != ''
        with:
          name: shorts-sample
          path: shorts_sample.mp4
          retention-days: 3

      - name: 숏츠 제작 + 업로드
        if: steps.due.outputs.go == '1' && inputs.sample == ''
        run: python -m bot shorts ${{ inputs.force == true && '--force' || '' }}

      - name: 변경사항 저장
        if: always() && steps.due.outputs.go == '1' && inputs.sample == ''
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add data/shorts_state.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: shorts $(date -u +%Y-%m-%dT%H:%MZ)"
            git push || (git pull --rebase && git push)
          fi
