name: bgm-get
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "비우면 즐겨찾기 곡, calm 이면 잔잔한 연주곡 후보"
        default: ""
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot bgm-get $MODE
        env:
          MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: bgm
          path: bgm_*.mp3
          retention-days: 1
